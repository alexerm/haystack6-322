  const d = z2 + cam.dist;
  if (d < 1) return null;
  const s = (H*0.9) / d;
  return { x: W/2 + x1*s + cam.tx, y: H/2 - y2*s + cam.ty, d: d, s: s };
}

function quad(x,z,y,h){ return [[x-h,y,z-h],[x+h,y,z-h],[x+h,y,z+h],[x-h,y,z+h]]; }

function build(){
  const prims = [];
  const onlyGraph = document.getElementById('tOnly').checked;
  if (document.getElementById('tFloors').checked)
    for (const f of DATA.floors){
      const pts = quad(f.x,f.z,f.y,f.h).map(project);
      if (pts.some(p=>!p)) continue;
      prims.push({ d: pts.reduce((a,p)=>a+p.d,0)/4, kind:'poly', pts:pts,
        fill:'rgba(90,110,140,0.16)', stroke:'rgba(120,150,190,0.34)' });
    }
  if (document.getElementById('tRotor').checked)
    for (const r of DATA.rotors){
      const pts=[]; for(let i=0;i<24;i++){ const a=i/24*Math.PI*2;
        const p=project([r.x+Math.cos(a)*r.r, r.y+1, r.z+Math.sin(a)*r.r]); if(!p){pts.length=0;break;} pts.push(p); }
      if(!pts.length) continue;
      prims.push({ d: pts.reduce((a,p)=>a+p.d,0)/pts.length, kind:'poly', pts:pts,
        fill:'rgba(232,121,249,0.16)', stroke:'#e879f9' });
    }
  const vis = DATA.boxes.filter(b => !onlyGraph || b.inGraph);
  if (document.getElementById('tBins').checked)
    for (const b of vis){
      const lo = project([b.x,b.y,b.z]), hi = project([b.x,b.rim,b.z]);
      if(!lo||!hi) continue;
      prims.push({ d:(lo.d+hi.d)/2, kind:'bin', a:lo, b:hi, box:b });
    }
  if (document.getElementById('tEdges').checked)
    for (const e of DATA.edges){
      const s = DATA.boxes.find(b=>b.id===e.s), t = DATA.boxes.find(b=>b.id===e.t);
      if(!s||!t) continue;
      if (onlyGraph && (!s.inGraph||!t.inGraph)) continue;
      const a = project([s.x,s.rim,s.z]), c = project([t.x,t.rim,t.z]);
      if(!a||!c) continue;
      prims.push({ d:(a.d+c.d)/2 + 6, kind:'edge', a:a, b:c, k:e.k, drive:e.drive,
        col:EDGE[e.k]||'#5a6672' });
    }
  for (const b of vis){
    const p = project([b.x,b.y,b.z]); if(!p) continue;
    prims.push({ d:p.d-1, kind:'node', p:p, box:b });
  }
  prims.sort((m,n)=>n.d-m.d);
  return prims;
}

let PRIMS=[], SEL=null;
function draw(){
  ctx.clearRect(0,0,W,H);
  PRIMS = build();
  const labels = document.getElementById('tLabels').checked;
  for (const q of PRIMS){
    if (q.kind==='poly'){
      ctx.beginPath(); ctx.moveTo(q.pts[0].x,q.pts[0].y);
      for(let i=1;i<q.pts.length;i++) ctx.lineTo(q.pts[i].x,q.pts[i].y);
      ctx.closePath(); ctx.fillStyle=q.fill; ctx.fill();
      ctx.strokeStyle=q.stroke; ctx.lineWidth=0.7; ctx.stroke();
    } else if (q.kind==='bin'){
      const on = SEL && q.box.id===SEL.id;
      ctx.beginPath(); ctx.moveTo(q.a.x,q.a.y); ctx.lineTo(q.b.x,q.b.y);
      ctx.strokeStyle = on ? '#ffffff' : colOf(q.box); ctx.globalAlpha = on?1:(q.box.dead?0.3:0.5);
      ctx.lineWidth = on?3:1.6; ctx.stroke(); ctx.globalAlpha=1;
    } else if (q.kind==='edge'){
      const on = SEL && (q.a===undefined);
      ctx.beginPath(); ctx.moveTo(q.a.x,q.a.y); ctx.lineTo(q.b.x,q.b.y);
      const drive = q.k==='elevator' && q.drive;
      ctx.setLineDash(drive?[3,4]:[]);
      ctx.strokeStyle=q.col; ctx.globalAlpha=drive?0.32:0.75;
      ctx.lineWidth=drive?1:1.8; ctx.stroke(); ctx.globalAlpha=1; ctx.setLineDash([]);
    } else {
      const on = SEL && q.box.id===SEL.id;
      const r = Math.max(2.2, Math.min(7, q.p.s*1.6));
      ctx.beginPath(); ctx.arc(q.p.x,q.p.y,on?r+3:r,0,Math.PI*2);
      ctx.fillStyle=colOf(q.box); ctx.fill();
      if(on){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
      else if(q.box.entry){ ctx.strokeStyle='#fff'; ctx.lineWidth=1.4; ctx.stroke();
        ctx.beginPath(); ctx.arc(q.p.x,q.p.y,r+4,0,Math.PI*2);
        ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1; ctx.stroke(); }
      if(labels && q.p.s>0.55){
        ctx.fillStyle='#8b949e'; ctx.font='10px ui-monospace,monospace';
        ctx.fillText(q.box.variant + (q.box.id!==null?'#'+q.box.id:''), q.p.x+r+3, q.p.y+3);
      }
    }
  }
  document.getElementById('hud').textContent =
    'yaw ' + (cam.yaw*180/Math.PI).toFixed(0) + 'deg  pitch ' + (cam.pitch*180/Math.PI).toFixed(0) +
    'deg  dist ' + cam.dist.toFixed(0) + ' m';
}

// ---- interaction ---------------------------------------------------------
let drag=null;
cv.addEventListener('mousedown', e=>{ drag={x:e.clientX,y:e.clientY,pan:e.shiftKey,moved:false}; cv.classList.add('drag'); });
window.addEventListener('mouseup', e=>{
  if(drag && !drag.moved) pick(e);
  drag=null; cv.classList.remove('drag');
});
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
  if(drag.pan){ cam.tx+=dx; cam.ty+=dy; }
  else { cam.yaw += dx*0.006; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy*0.006)); }
  drag.x=e.clientX; drag.y=e.clientY; draw();
});
cv.addEventListener('wheel', e=>{
  e.preventDefault(); cam.dist = Math.max(60, Math.min(1600, cam.dist * (1 + Math.sign(e.deltaY)*0.1))); draw();
}, {passive:false});

function pick(e){
  const r = cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  let best=null, bd=14;
  for(const q of PRIMS){
    if(q.kind!=='node') continue;
    const d = Math.hypot(q.p.x-mx, q.p.y-my);
    if(d<bd){ bd=d; best=q.box; }
  }
  SEL = best; showDetail(); draw();
}
function showDetail(){
  const el = document.getElementById('detail');
  if(!SEL){ el.textContent='click a bin'; return; }
  const b = SEL;
  const outs = DATA.edges.filter(e=>e.s===b.id), ins = DATA.edges.filter(e=>e.t===b.id);
  const rows = [
    ['variant', b.variant + (b.id!==null?'  #'+b.id:'')],
    ['position', b.x.toFixed(0)+', '+b.y.toFixed(0)+', '+b.z.toFixed(0)],
    ['rim', b.rim.toFixed(1) + '  (bin ' + (b.rim-b.y).toFixed(1) + ' m deep)'],
    ['respawn', b.spawn ? b.spawn.map(v=>v.toFixed(1)).join(', ') : '—'],
    ['group', b.group!==null ? b.group + '  (' + b.groupSize + ' members)' : '—'],
    ['edges', ins.length + ' in / ' + outs.length + ' out']
  ];
  el.innerHTML = rows.map(r=>'<div class="row"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('')
    + (b.role ? '<div class="hint" style="margin-top:8px">'+b.role+'</div>' : '');
}

document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>{
  const v=btn.dataset.view;
  if(v==='iso'){cam.yaw=0.7;cam.pitch=0.34;cam.dist=175;}
  if(v==='front'){cam.yaw=0;cam.pitch=0;cam.dist=175;}
  if(v==='side'){cam.yaw=Math.PI/2;cam.pitch=0;cam.dist=175;}
  if(v==='top'){cam.yaw=0;cam.pitch=1.45;cam.dist=175;}
  cam.tx=0;cam.ty=0; draw();
}));
for(const id of ['tFloors','tBins','tEdges','tRotor','tOnly','tLabels'])
  document.getElementById(id).addEventListener('change', draw);

const LEG = [['door','teleports you onto a deck'],['ring','ring cell (lower only)'],
  ['corner','corner pit'],['vertical','the 8 m step'],['middle','shared middle run'],
  ['goal-cp','CP#104 + Finish']];
document.getElementById('leg').innerHTML =
  LEG.map(([k,t])=>'<div><i class="sw" style="background:'+ROLE[k]+'"></i>'+t+'</div>').join('') +
  '<div><i class="sw" style="background:#4a5568"></i>unreachable (12 upper EndFW)</div>' +
  '<div style="margin-top:6px"><i class="sw" style="background:'+EDGE.fall+'"></i>forced landing</div>' +
  '<div><i class="sw" style="background:'+EDGE.teleport+'"></i>lower door (forced)</div>' +
  '<div><i class="sw" style="background:'+EDGE.elevator+'"></i>upper deck: drive to any corner</div>' +
  '<div style="margin-top:6px;color:#5a6672">white ring = one of the 8 entry pits</div>';
document.getElementById('sub').textContent =
  DATA.meta.nBoxes + ' checkpoints · ' + DATA.meta.nEdges + ' edges · ' + DATA.meta.nFloors + ' floor tiles';
resize();
</script></body></html>
